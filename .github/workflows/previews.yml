# Runs the JS tests and typecheck, builds the web preview of every app in apps/ (Expo web export), publishes them as a
# single commit on the `previews` branch, then asks the server to deploy.
# Builds run here, never on the server. Each app's app.json sets
# expo.experiments.baseUrl = "/preview/<slug>" so assets load from the right path.
name: previews

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: previews
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Each app's Supabase schema + access-rule tests, on a throwaway Postgres.
  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Schema and access-rule tests
        run: |
          for app in apps/*/; do
            [ -f "$app/supabase/schema.sql" ] || continue
            echo "== $app"
            psql -v ON_ERROR_STOP=1 -q -c "drop database if exists t" -c "create database t"
            # schema applied twice: it must be safe to re-run in the Supabase SQL editor
            psql -v ON_ERROR_STOP=1 -q -d t \
              -f "$app/supabase/ci-auth-stub.sql" \
              -f "$app/supabase/schema.sql" -f "$app/supabase/schema.sql" \
              -f "$app/supabase/test.sql"
          done

  build-and-deploy:
    needs: db-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: hashFiles('package-lock.json') != ''
        run: npm ci --no-audit --no-fund

      - name: Tests
        if: hashFiles('package-lock.json') != ''
        run: npm test

      - name: Typecheck
        if: hashFiles('package-lock.json') != ''
        run: npm run typecheck

      - name: Export web previews
        env:
          # Public by design (shipped in every app); kept as repo variables, not in git.
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p out
          for dir in apps/*/; do
            [ -f "$dir/app.json" ] || continue
            slug=$(basename "$dir")
            echo "Exporting $slug"
            (cd "$dir" && npx expo export --platform web --output-dir "$GITHUB_WORKSPACE/out/$slug")
          done
          ls out

      - name: Publish to previews branch
        run: |
          if [ -z "$(ls -A out)" ]; then echo "No apps yet; nothing to publish."; exit 0; fi
          cd out
          git init -q -b previews
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Previews for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" previews

      - name: Trigger deploy on the server
        env:
          SECRET: ${{ secrets.APPLAB_WEBHOOK_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then echo "APPLAB_WEBHOOK_SECRET not set; skipping deploy." ; exit 0; fi
          payload='{"ref":"refs/heads/main"}'
          sig="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$SECRET" -r | cut -d' ' -f1)"
          curl -fsS -X POST https://apps.trade-bot.uk/deploy/applab \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: $sig" \
            --data "$payload"

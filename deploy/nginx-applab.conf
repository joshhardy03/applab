# apps.trade-bot.uk — App Lab dashboard + public web previews (gunicorn on 127.0.0.1:5080)
# Copied from ~/reseller/deploy/nginx-reseller.conf.
# Deploy: sudo cp deploy/nginx-applab.conf /etc/nginx/sites-available/applab
#         sudo ln -sf /etc/nginx/sites-available/applab /etc/nginx/sites-enabled/applab
#         sudo nginx -t && sudo systemctl reload nginx
# TLS: Cloudflare origin certificate, same as the other trade-bot.uk sites.

server {
    listen 80;
    listen [::]:80;
    server_name apps.trade-bot.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name apps.trade-bot.uk;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Deploy trigger (from the GitHub Actions preview workflow) → ~/webhook.py
    location = /deploy/applab {
        proxy_pass http://127.0.0.1:9000/deploy/applab;
    }

    # Dashboard (login) and /preview/<slug>/ (public) both go through Flask:
    # nginx can't read /home/botuser directly.
    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
